[project]
name = "voice-tutor"
version = "0.1.0"
description = "Tutor de inglés por voz (B1→B2): conversación natural de 10 minutos con aprendizaje adaptativo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "kokoro-onnx>=0.6.1",
    "mlx-whisper>=0.4.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: requiere los modelos locales descargados en ./models"]
