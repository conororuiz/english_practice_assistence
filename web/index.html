<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Voice Tutor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="brand">Speak<span>up</span> <span id="streak" class="streak hidden" title="Días seguidos con clase"></span></div>
    <nav>
      <button id="nav-lesson" class="link active">Lección</button>
      <button id="nav-progress" class="link">Progreso</button>
    </nav>
  </header>

  <main id="view-lesson">
    <div id="lesson-meta" class="meta">&nbsp;</div>
    <section id="today" class="today hidden"></section>
    <section id="rp-picker" class="rp-picker">
      <div class="rp-head">O practica una situación de trabajo <span class="muted">(role-play, 10 min)</span></div>
      <div id="rp-list" class="chips"></div>
    </section>

    <div class="stage">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="92" />
        <circle id="ring-fg" class="ring-fg" cx="100" cy="100" r="92" />
      </svg>
      <div id="orb" class="orb idle"><div class="core"></div></div>
      <div id="clock" class="clock">15:00</div>
    </div>

    <div id="status" class="status">Pulsa para empezar tu clase de 15 minutos</div>
    <div id="phase" class="phase"></div>
    <ol id="steps" class="steps hidden">
      <li data-p="warmup">Saludo</li><li data-p="teach">Explicación</li><li data-p="drill">Ejercicios</li>
      <li data-p="produce">Conversación</li><li data-p="review">Repaso</li><li data-p="wrapup">Cierre</li>
    </ol>

    <div id="captions" class="captions">
      <div id="cap-tutor" class="cap tutor"></div>
      <div id="cap-user" class="cap user"></div>
    </div>

    <div id="tools" class="tools hidden">
      <button id="t-repeat" class="ghost small" title="El profesor repite su última frase">🔁 Repite</button>
      <button id="t-slower" class="ghost small" title="La repite más despacio">🐢 Más despacio</button>
      <button id="t-translate" class="ghost small" title="Traducción en pantalla (no se dice en voz alta)">🇪🇸 Traducir</button>
      <button id="t-help" class="ghost small" title="Ideas para empezar tu respuesta">💡 Ayúdame a responder</button>
    </div>
    <div id="assist" class="assist hidden"></div>

    <div class="controls">
      <button id="start" class="primary">Empezar clase</button>
      <button id="pause" class="ghost hidden" title="Pausa la clase: el reloj se para y no te escucha (tecla P)">⏸ Pausa</button>
      <button id="end" class="ghost hidden">Terminar</button>
      <button id="cc" class="ghost small" title="Subtítulos">CC</button>
    </div>

    <section id="feedback" class="feedback hidden">
      <h2>Tus respuestas, analizadas</h2>
      <div id="feedback-list"></div>
    </section>

    <div id="debug" class="debug hidden"></div>
    <div id="banner" class="banner hidden"></div>

    <section id="summary" class="summary hidden"></section>
  </main>

  <main id="view-progress" class="hidden">
    <section id="progress"></section>
  </main>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
